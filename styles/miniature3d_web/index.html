<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>微缩办公室</title>
<style>
  @font-face { font-family: "NotoSansSC"; src: url("../../assets/fonts/NotoSansCJKsc-Medium.otf"); font-weight: 500; }
  @font-face { font-family: "NotoSansSC"; src: url("../../assets/fonts/NotoSansCJKsc-Black.otf"); font-weight: 900; }

               "three/addons/": "../../ac3d/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <canvas id="gl" width="1080" height="1920"></canvas>
  <canvas id="fx" width="1080" height="1920"></canvas>
  <div id="ui"></div>
</div>
<script type="module" src="./scene.js"></script>
</body>
</html>
