<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>换了哪把尺子</title>
<style>
  :root { --stage: #18201B; --fg: #F4EFE4; --accent: #2E7D5B; }
  html, body { margin: 0; height: 100%; background: var(--stage); color: var(--fg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", "WenQuanYi Zen Hei", sans-serif; }
  #wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 10px 16px; box-sizing: border-box; }
  #cv { display: block; width: min(100%, calc((100vh - 96px) * 9 / 16)); height: auto; background: #F4EFE4;
    box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  #ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; width: min(100%, 640px); font-size: 14px; }
  #ctrl button { background: #2A352E; color: var(--fg); border: 1px solid #3E4C43; border-radius: 6px; padding: 6px 10px;
    font: inherit; cursor: pointer; min-width: 44px; }
  #ctrl button:hover { background: #34433A; }
  #seek { flex: 1 1 200px; accent-color: var(--accent); }
  #time { font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
  body.rec #wrap { padding: 0; gap: 0; }
  body.rec #ctrl { display: none; }
  body.rec #cv { width: min(100vw, calc(100vh * 9 / 16)); box-shadow: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="1080" height="1920" aria-label="无声竖屏科普动画：社会比较"></canvas>
  <div id="ctrl">
    <button id="play" title="播放 / 暂停（空格）">播放</button>
    <button id="restart" title="从头重播（Home）">重播</button>
    <input id="seek" type="range" min="0" max="90" step="0.0333" value="0" aria-label="进度">
    <span id="time">00.00 / 90.00</span>
    <button id="rec" title="录制模式：隐藏控件（Esc 退出）">录制模式</button>
  </div>
</div>
<script>
'use strict';
/* =====================================================================
 * 《你的焦虑，换了哪把尺子？》—— 社会比较 · 90 秒无声竖屏动画
 * 画布 1080×1920，30fps。render(t) 是纯函数：同一个 t 永远画出同一帧，
 * 预览、拖动与逐帧导出共用同一条时间轴。
 * ===================================================================== */
const W = 1080, H = 1920, FPS = 30, DUR = 90;
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Zen Hei","WenQuanYi Micro Hei",sans-serif';
const SERIF = 'Georgia,"Times New Roman","DejaVu Serif","Liberation Serif",serif';
const C = {
  bg: '#F4EFE4', bg2: '#EAE2D1', sepia: '#EFE3C8', ink: '#1B2A22', soft: '#5E6A61',
  green: '#1F5A40', green2: '#2E7D5B', greenL: '#D3E6D9', mag: '#C2185B', magL: '#F6D5E2',
  paper: '#FFFDF7', track: '#E2D8C2', skin: '#F2D0B1', hair: '#2A211C',
  blue: '#3B6EA8', ochre: '#C99428', terra: '#D9694C', grey: '#A7ADA4',
};
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

/* ---------------------------------------------------------- 基础工具 */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = p => 1 - Math.pow(1 - p, 3);
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const bo = p => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const font = (px, w = 700) => `${w} ${px}px ${FONT}`;
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function txt(s, x, y, px, col, align = 'center', w = 700) {
  ctx.font = font(px, w); ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
  return ctx.measureText(s).width;
}
/* 弹入缩放：0→1 的出现进度，带轻微回弹 */
function popIn(t, t0, d = .4) { return bo(seg(t, t0, t0 + d)); }
function withAlpha(a, fn) { if (a <= 0.001) return; ctx.save(); ctx.globalAlpha *= a; fn(); ctx.restore(); }
function scaled(x, y, s, fn) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.translate(-x, -y); fn(); ctx.restore(); }

/* ---------------------------------------------------------- 背景 */
function bgBase(t, col = C.bg, dots = C.greenL) {
  ctx.fillStyle = col; ctx.fillRect(0, 0, W, H);
  // 缓慢漂移的大圆，只做氛围，不承载信息
  const blobs = [[160, 520, 220, .9], [940, 900, 260, 1.3], [260, 1500, 240, .7], [880, 1700, 200, 1.1]];
  ctx.fillStyle = dots;
  blobs.forEach(([x, y, r, k], i) => {
    withAlpha(.35, () => { circ(x + Math.sin(t * .25 * k + i) * 30, y + Math.cos(t * .2 * k + i) * 24, r); ctx.fill(); });
  });
  // 网点纸纹
  ctx.fillStyle = 'rgba(27,42,34,.05)';
  for (let y = 40; y < H; y += 64) for (let x = (y / 64 % 2) * 32 + 20; x < W; x += 64) { circ(x, y, 2.2); ctx.fill(); }
}

/* ---------------------------------------------------------- 人物（全片统一造型） */
const XY = { hs: 'bob', hair: C.hair, top: C.green, bottom: '#59605A', clip: true };   // 小叶
const PEOPLE = {
  classmate: { hs: 'pony', hair: '#5A3B2A', top: '#3B6EA8', bottom: '#384255' },
  colleague: { hs: 'short', hair: '#22262A', top: '#7A5C99', bottom: '#3F3A46' },
  friend: { hs: 'curly', hair: '#3A2A20', top: '#D9694C', bottom: '#4E4038' },
  jia: { hs: 'short', hair: '#22262A', top: C.blue, bottom: '#384255', letter: '甲' },
  yi: { hs: 'bun', hair: '#4A3426', top: C.ochre, bottom: '#5B4A2E', letter: '乙' },
  bing: { hs: 'curly', hair: '#3A2A20', top: C.terra, bottom: '#4E4038', letter: '丙' },
  mentor: { hs: 'short', hair: '#3B3B3B', top: '#3B6EA8', bottom: '#454B55', glasses: true },
  peerA: { hs: 'short', hair: '#555', top: '#8B9389', bottom: '#666C66' },
  peerB: { hs: 'bun', hair: '#555', top: '#8B9389', bottom: '#666C66' },
};
function blinkAt(t, seed = 0) { const ph = (t + seed * 1.37) % 3.7; return ph < .12 ? 1 : 0; }

function drawPerson(x, y, s, o) {
  const P = Object.assign({ skin: C.skin, hair: C.hair, hs: 'short', top: C.green, bottom: '#59605A', mood: 'neutral',
    armL: [.12, .05], armR: [.12, .05], look: 0, alpha: 1, blink: 0, clip: false, glasses: false, letter: null,
    hold: null, glow: 0, bob: 0, lean: 0 }, o);
  ctx.save(); ctx.globalAlpha *= P.alpha; ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(30,50,40,.16)'; ell(0, 0, 100, 16); ctx.fill();
  ctx.translate(0, -P.bob); ctx.rotate(P.lean);
  // 腿与鞋
  ctx.fillStyle = P.bottom; rr(-44, -138, 38, 134, 16); ctx.fill(); rr(6, -138, 38, 134, 16); ctx.fill();
  ctx.fillStyle = '#2B2B2B'; ell(-27, -6, 30, 12); ctx.fill(); ell(27, -6, 30, 12); ctx.fill();
  // 后发
  if (P.hs === 'bob') { ctx.fillStyle = P.hair; rr(-84, -448, 168, 140, [70, 70, 30, 30]); ctx.fill(); }
  if (P.hs === 'pony') { ctx.fillStyle = P.hair; ell(78, -360, 26, 64); ctx.fill(); }
  // 躯干
  ctx.fillStyle = P.top; ctx.beginPath(); ctx.moveTo(-72, -288); ctx.quadraticCurveTo(0, -306, 72, -288);
  ctx.lineTo(64, -128); ctx.quadraticCurveTo(0, -114, -64, -128); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.moveTo(-22, -296); ctx.lineTo(0, -268); ctx.lineTo(22, -296); ctx.closePath(); ctx.fill();
  if (P.letter) { ctx.font = font(54); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(P.letter, 0, -205); }
  // 手臂（两段：上臂 + 前臂）
  const hands = [];
  [[-1, P.armL], [1, P.armR]].forEach(([side, a]) => {
    const sx = side * 64, sy = -272;
    const mx = sx + side * Math.sin(a[0]) * 72, my = sy + Math.cos(a[0]) * 72;
    const ex = mx + side * Math.sin(a[1]) * 70, ey = my + Math.cos(a[1]) * 70;
    ctx.strokeStyle = P.top; ctx.lineWidth = 30; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(mx, my); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.fillStyle = P.skin; circ(ex, ey, 17); ctx.fill();
    hands.push([ex, ey]);
  });
  // 脖子与头
  ctx.fillStyle = P.skin; rr(-16, -318, 32, 34, 8); ctx.fill();
  circ(0, -378, 70); ctx.fill();
  hairFront(P);
  face(P);
  if (P.glasses) { ctx.strokeStyle = '#2B2B2B'; ctx.lineWidth = 4; circ(-26 + P.look * 8, -376, 17); ctx.stroke(); circ(26 + P.look * 8, -376, 17); ctx.stroke(); line(-9 + P.look * 8, -378, 9 + P.look * 8, -378); }
  // 手持物
  if (P.hold === 'phone') { const [hx, hy] = hands[1]; drawPhoneSmall(hx - 6, hy - 30, P.glow); }
  if (P.hold === 'note') { const [hx, hy] = hands[0]; drawNotebook(hx + 34, hy - 18, P.noteP || 0); }
  ctx.restore();
}
function hairFront(P) {
  ctx.fillStyle = P.hair;
  if (P.hs === 'bob') {
    ctx.beginPath(); ctx.arc(0, -380, 75, Math.PI, 0); ctx.lineTo(75, -360);
    ctx.quadraticCurveTo(44, -414, 4, -400); ctx.quadraticCurveTo(-40, -416, -75, -360); ctx.closePath(); ctx.fill();
    if (P.clip) { ctx.fillStyle = '#E6B54A'; rr(38, -432, 34, 14, 7); ctx.fill(); }
  } else if (P.hs === 'curly') {
    for (let i = 0; i < 9; i++) { const a = Math.PI + i * Math.PI / 8; circ(Math.cos(a) * 66, -386 + Math.sin(a) * 62, 28); ctx.fill(); }
  } else {
    ctx.beginPath(); ctx.arc(0, -382, 74, Math.PI * 1.02, -0.02); ctx.quadraticCurveTo(30, -400, -10, -404);
    ctx.quadraticCurveTo(-50, -400, -73, -372); ctx.closePath(); ctx.fill();
    if (P.hs === 'bun') { circ(0, -462, 30); ctx.fill(); }
  }
}
function face(P) {
  const lx = P.look * 8, ey = -376, closed = P.blink > 0;
  ctx.strokeStyle = ctx.fillStyle = '#22201E'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  const dotEyes = (r = 7, dy = 0) => {
    [-26, 26].forEach(dx => {
      if (closed) line(dx + lx - 8, ey + dy, dx + lx + 8, ey + dy);
      else { ctx.fillStyle = '#22201E'; circ(dx + lx, ey + dy, r); ctx.fill(); }
    });
  };
  const blush = () => { ctx.fillStyle = 'rgba(232,120,130,.35)'; ell(-44, -350, 14, 8); ctx.fill(); ell(44, -350, 14, 8); ctx.fill(); };
  switch (P.mood) {
    case 'happy':
      [-26, 26].forEach(dx => { ctx.beginPath(); ctx.arc(dx + lx, ey + 6, 11, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); });
      ctx.beginPath(); ctx.arc(lx, -352, 20, .15 * Math.PI, .85 * Math.PI); ctx.stroke(); blush(); break;
    case 'smile':
      dotEyes(); ctx.beginPath(); ctx.arc(lx, -354, 16, .2 * Math.PI, .8 * Math.PI); ctx.stroke(); blush(); break;
    case 'worried':
      dotEyes(6, 2);
      line(-38 + lx, -404, -16 + lx, -412); line(38 + lx, -404, 16 + lx, -412);
      ctx.beginPath(); ctx.moveTo(-14 + lx, -340); ctx.quadraticCurveTo(-5 + lx, -348, lx, -341); ctx.quadraticCurveTo(5 + lx, -334, 14 + lx, -342); ctx.stroke();
      ctx.fillStyle = '#9CC4DD'; ctx.beginPath(); ctx.moveTo(70, -420); ctx.quadraticCurveTo(84, -396, 70, -392); ctx.quadraticCurveTo(56, -396, 70, -420); ctx.fill(); break;
    case 'surprised':
      [-26, 26].forEach(dx => { ctx.fillStyle = '#22201E'; circ(dx + lx, ey, 10); ctx.fill(); ctx.fillStyle = '#fff'; circ(dx + lx + 3, ey - 3, 3); ctx.fill(); });
      line(-36 + lx, -414, -16 + lx, -418); line(36 + lx, -414, 16 + lx, -418);
      ctx.fillStyle = '#22201E'; ell(lx, -342, 9, 12); ctx.fill(); break;
    case 'think':
      [-26, 26].forEach(dx => { ctx.fillStyle = '#22201E'; circ(dx + lx - 4, ey - 5, 7); ctx.fill(); });
      line(lx - 6, -344, lx + 12, -348); break;
    default:
      dotEyes(); line(lx - 12, -346, lx + 12, -346);
  }
}
/* 头像：把同一套人物裁进圆框，保证造型一致 */
function avatar(x, y, R, P, mood = 'smile', bg = '#fff') {
  ctx.save(); circ(x, y, R); ctx.fillStyle = bg; ctx.fill(); ctx.clip();
  const s = R / 100; drawPerson(x, y + 378 * s + 30 * s, s, Object.assign({}, P, { mood }));
  ctx.restore();
}

/* ---------------------------------------------------------- 道具 */
function drawPhoneSmall(x, y, glow) {
  if (glow > 0) {
    const g = ctx.createRadialGradient(x, y, 10, x, y, 150);
    g.addColorStop(0, `rgba(255,236,246,${.9 * glow})`); g.addColorStop(1, 'rgba(255,236,246,0)');
    ctx.fillStyle = g; circ(x, y, 150); ctx.fill();
  }
  ctx.fillStyle = '#26302A'; rr(x - 28, y - 48, 56, 96, 10); ctx.fill();
  ctx.fillStyle = glow > 0 ? `rgb(${lerp(70, 255, glow)},${lerp(90, 240, glow)},${lerp(80, 248, glow)})` : '#46564C';
  rr(x - 22, y - 40, 44, 78, 6); ctx.fill();
  if (glow > .5) { ctx.fillStyle = C.mag; circ(x + 24, y - 46, 12 * glow); ctx.fill(); }
}
function drawNotebook(x, y, p) {
  ctx.fillStyle = '#fff'; ctx.strokeStyle = C.green; ctx.lineWidth = 4; rr(x - 40, y - 52, 80, 100, 8); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = C.green2; ctx.lineWidth = 5;
  for (let i = 0; i < 4; i++) { const q = clamp(p * 4 - i); if (q > 0) line(x - 26, y - 30 + i * 20, x - 26 + 52 * q, y - 30 + i * 20); }
}
function check(x, y, s, col = C.green2, p = 1) {
  ctx.strokeStyle = col; ctx.lineWidth = 8 * s; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); const pts = [[-14, 0], [-4, 11], [16, -12]];
  ctx.moveTo(x + pts[0][0] * s, y + pts[0][1] * s);
  if (p < .4) { const q = p / .4; ctx.lineTo(x + lerp(pts[0][0], pts[1][0], q) * s, y + lerp(pts[0][1], pts[1][1], q) * s); }
  else { const q = (p - .4) / .6; ctx.lineTo(x + pts[1][0] * s, y + pts[1][1] * s); ctx.lineTo(x + lerp(pts[1][0], pts[2][0], q) * s, y + lerp(pts[1][1], pts[2][1], q) * s); }
  ctx.stroke();
}
function cross(x, y, s, col = C.mag) { ctx.strokeStyle = col; ctx.lineWidth = 8 * s; ctx.lineCap = 'round'; line(x - 12 * s, y - 12 * s, x + 12 * s, y + 12 * s); line(x + 12 * s, y - 12 * s, x - 12 * s, y + 12 * s); }
function arrowUp(x, y, s, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x, y - 22 * s); ctx.lineTo(x + 18 * s, y); ctx.lineTo(x + 7 * s, y); ctx.lineTo(x + 7 * s, y + 20 * s); ctx.lineTo(x - 7 * s, y + 20 * s); ctx.lineTo(x - 7 * s, y); ctx.lineTo(x - 18 * s, y); ctx.closePath(); ctx.fill(); }
function star(x, y, r, col) { ctx.fillStyle = col; ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * .45 : r; ctx.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); } ctx.closePath(); ctx.fill(); }
function icon(kind, x, y, s, col) {
  ctx.save(); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 5 * s; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (kind === 'mail') { rr(x - 24 * s, y - 17 * s, 48 * s, 34 * s, 5 * s); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x - 22 * s, y - 14 * s); ctx.lineTo(x, y + 3 * s); ctx.lineTo(x + 22 * s, y - 14 * s); ctx.stroke(); }
  if (kind === 'up') arrowUp(x, y, s * 1.1, col);
  if (kind === 'frame') { rr(x - 24 * s, y - 20 * s, 48 * s, 40 * s, 4 * s); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x - 18 * s, y + 14 * s); ctx.lineTo(x - 4 * s, y - 4 * s); ctx.lineTo(x + 6 * s, y + 6 * s); ctx.lineTo(x + 12 * s, y); ctx.lineTo(x + 18 * s, y + 14 * s); ctx.stroke(); }
  if (kind === 'book') { ctx.beginPath(); ctx.moveTo(x, y - 14 * s); ctx.quadraticCurveTo(x - 14 * s, y - 22 * s, x - 26 * s, y - 16 * s); ctx.lineTo(x - 26 * s, y + 18 * s); ctx.quadraticCurveTo(x - 14 * s, y + 12 * s, x, y + 20 * s); ctx.quadraticCurveTo(x + 14 * s, y + 12 * s, x + 26 * s, y + 18 * s); ctx.lineTo(x + 26 * s, y - 16 * s); ctx.quadraticCurveTo(x + 14 * s, y - 22 * s, x, y - 14 * s); ctx.lineTo(x, y + 20 * s); ctx.stroke(); }
  if (kind === 'coin') { circ(x - 8 * s, y + 4 * s, 16 * s); ctx.stroke(); circ(x + 10 * s, y - 6 * s, 16 * s); ctx.stroke(); }
  if (kind === 'sun') { circ(x - 10 * s, y - 8 * s, 9 * s); ctx.fill(); ctx.beginPath(); ctx.moveTo(x - 26 * s, y + 18 * s); ctx.lineTo(x - 2 * s, y - 2 * s); ctx.lineTo(x + 10 * s, y + 8 * s); ctx.lineTo(x + 18 * s, y); ctx.lineTo(x + 28 * s, y + 18 * s); ctx.closePath(); ctx.fill(); }
  if (kind === 'clock') { circ(x, y, 22 * s); ctx.stroke(); line(x, y, x, y - 12 * s); line(x, y, x + 10 * s, y); }
  if (kind === 'tool') { ctx.beginPath(); ctx.moveTo(x - 16 * s, y + 16 * s); ctx.lineTo(x + 8 * s, y - 8 * s); ctx.stroke(); circ(x + 12 * s, y - 12 * s, 9 * s); ctx.stroke(); }
  if (kind === 'chat') { rr(x - 24 * s, y - 18 * s, 48 * s, 30 * s, 10 * s); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x - 8 * s, y + 12 * s); ctx.lineTo(x - 14 * s, y + 22 * s); ctx.lineTo(x + 2 * s, y + 12 * s); ctx.stroke(); }
  if (kind === 'pin') { circ(x, y - 8 * s, 11 * s); ctx.fill(); line(x, y, x, y + 18 * s); }
  if (kind === 'heart') { ctx.beginPath(); ctx.moveTo(x, y + 16 * s); ctx.bezierCurveTo(x - 30 * s, y - 4 * s, x - 14 * s, y - 26 * s, x, y - 10 * s); ctx.bezierCurveTo(x + 14 * s, y - 26 * s, x + 30 * s, y - 4 * s, x, y + 16 * s); ctx.fill(); }
  ctx.restore();
}
function pill(s, x, y, px, fg, bg, align = 'center', border = null) {
  ctx.font = font(px); const w = ctx.measureText(s).width + px * 1.1, h = px * 1.55;
  const x0 = align === 'left' ? x : x - w / 2;
  ctx.fillStyle = bg; rr(x0, y - h / 2, w, h, h / 2); ctx.fill();
  if (border) { ctx.strokeStyle = border; ctx.lineWidth = 3; ctx.stroke(); }
  txt(s, x0 + w / 2, y + 1, px, fg);
  return { x0, x1: x0 + w };
}
/* 竖直比较尺：高度即“参照标准” */
function drawRuler(x, baseY, h, col = C.mag, w = 64) {
  ctx.fillStyle = col; rr(x - w / 2, baseY - h, w, h, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 4;
  for (let k = 30, i = 1; k < h - 8; k += 30, i++) line(x - w / 2, baseY - k, x - w / 2 + (i % 5 === 0 ? 34 : 18), baseY - k);
}
/* 透视赛道：topY 越高越远，stress 让跑道染上压力色 */
function drawTrack(cx, by, ty, stress, t, flag = true, flagCol = C.green) {
  const bw = 940, tw = lerp(280, 110, stress);
  const quad = () => { ctx.beginPath(); ctx.moveTo(cx - bw / 2, by); ctx.lineTo(cx + bw / 2, by); ctx.lineTo(cx + tw / 2, ty); ctx.lineTo(cx - tw / 2, ty); ctx.closePath(); };
  ctx.fillStyle = C.track; quad(); ctx.fill();
  if (stress > 0) { ctx.fillStyle = `rgba(194,24,91,${.16 * stress})`; quad(); ctx.fill(); }
  ctx.strokeStyle = C.green; ctx.lineWidth = 6; line(cx - bw / 2, by, cx - tw / 2, ty); line(cx + bw / 2, by, cx + tw / 2, ty);
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  for (let k = 0; k < 10; k++) {
    const u = ((k + (t * .9) % 1) / 10), q = u * u, yy = lerp(ty, by, q), ww = lerp(tw, bw, q) / bw;

/* 剪纸拼人：头=丙的生活，身=甲的成绩，腿=乙的收入。h 为总高，sep 为拆开程度 */
function patchwork(cx, by, h, sep, alpha, seam) {
  const s = h / 1000;
  const parts = {
    head: { col: C.terra, ic: 'sun', off: [-230, 60], path: () => { circ(cx, by - 860 * s, 125 * s); } },
    torso: { col: C.blue, ic: 'book', off: [0, 30], path: () => { ctx.beginPath(); ctx.moveTo(cx - 190 * s, by - 720 * s); ctx.quadraticCurveTo(cx, by - 760 * s, cx + 190 * s, by - 720 * s); ctx.lineTo(cx + 160 * s, by - 380 * s); ctx.lineTo(cx - 160 * s, by - 380 * s); ctx.closePath(); } },
    legs: { col: C.ochre, ic: 'coin', off: [230, 0], path: () => { ctx.beginPath(); ctx.roundRect(cx - 150 * s, by - 380 * s, 130 * s, 380 * s, 30 * s); ctx.roundRect(cx + 20 * s, by - 380 * s, 130 * s, 380 * s, 30 * s); } },
  };
  withAlpha(alpha, () => {
    Object.values(parts).forEach(pt => {
      ctx.save(); ctx.translate(pt.off[0] * sep, pt.off[1] * sep);
      pt.path(); ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 26 * s + 6; ctx.stroke(); ctx.fill();
      pt.path(); ctx.fillStyle = pt.col; ctx.fill();
      ctx.save(); pt.path(); ctx.clip();
      // 剪纸纹理：斜线
      ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 10 * s + 2;
      for (let k = -1200; k < 1200; k += 60 * s + 20) line(cx + k, by - 1000 * s, cx + k + 600 * s, by);
      ctx.restore();
      ctx.setLineDash([14, 10]); ctx.strokeStyle = seam > 0 ? `rgba(194,24,91,${.4 + .6 * seam})` : 'rgba(194,24,91,.4)'; ctx.lineWidth = 4 + 6 * seam;
      pt.path(); ctx.stroke(); ctx.setLineDash([]);
      ctx.restore();
    });
    // 图标贴在各部件中心
    const c = { head: [0, -860], torso: [0, -560], legs: [0, -190] };
    Object.entries(parts).forEach(([k, pt]) => icon(pt.ic, cx + c[k][0] * s + pt.off[0] * sep, by + c[k][1] * s + pt.off[1] * sep, 3 * s + .4, '#fff'));
  });
  return parts;
}

  if (t < T.t0 || t > T.t1) return 0;

  const b = T.noOut ? 1 : 1 - seg(t, T.t1 - FADE_OUT, T.t1);

    const hlBg = hl === C.mag ? 'rgba(194,24,91,.16)' : 'rgba(46,125,91,.18)';
    ctx.save(); ctx.globalAlpha = a;
    // 文字底衬：保证在任何画面上都高对比
    ctx.font = font(px, 800);
    const widths = T.lines.map(l => ctx.measureText(l.replace(/[【】]/g, '')).width);
    const mw = Math.max(...widths);
    ctx.fillStyle = 'rgba(244,239,228,.92)';
    rr(540 - mw / 2 - 34, y0 - px * .5 - 26, mw + 68, (T.lines.length - 1) * lh + px + 52, 28); ctx.fill();
    T.lines.forEach((l, i) => {
      const cy = y0 + i * lh;
      ctx.font = font(px, 800);
      const segs = parseMark(l); let w = 0; segs.forEach(s => { s.w = ctx.measureText(s.s).width; w += s.w; });
      let x = 540 - w / 2;
      noteBox(T.id, x, cy - px / 2, x + w, cy + px / 2);
      segs.forEach(s => {
        if (s.hl) {
          const hp = T.instant ? eo(seg(t, .4, 1.0)) : eo(seg(t, T.t0 + .3, T.t0 + .8));
          ctx.fillStyle = hlBg; rr(x - 6, cy + px * .1, (s.w + 12) * hp, px * .42, 8); ctx.fill();
        }
        ctx.fillStyle = s.hl ? hl : C.ink; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText(s.s, x, cy + 2); x += s.w;
      });
    });
    ctx.restore();
  });
  NOTES.forEach(N => {
    const a = textAlpha(N, t); if (a <= 0) return;
    withAlpha(a, () => {
      ctx.font = font(36, 700); const w = ctx.measureText(N.s).width;
      ctx.fillStyle = N.box ? 'rgba(255,253,247,.96)' : 'rgba(244,239,228,.92)';
      rr(540 - w / 2 - 24, N.y - 34, w + 48, 68, 34); ctx.fill();
      if (N.box) { ctx.strokeStyle = C.green2; ctx.lineWidth = 3; ctx.stroke(); }
      txt(N.s, 540, N.y + 1, 36, N.box ? C.green : C.soft);
      noteBox(N.id, 540 - w / 2, N.y - 18, 540 + w / 2, N.y + 18);
    });
  });
  LABELS.forEach((L, i) => {
    if (t < L.t0 || t >= L.t1) return;
    const a = seg(t, L.t0, L.t0 + .3) || (L.t0 === 0 ? 1 : 0);
    withAlpha(L.t0 === 0 ? 1 : a, () => {
      const b = pill(L.s, 100, 212, 36, '#fff', C.green, 'left');
      noteBox('label' + i, b.x0, 212 - 28, b.x1, 212 + 28);
    });
  });
}

function clipFor(tr, p) {
  ctx.beginPath();
  if (tr.type === 'iris') ctx.arc(tr.x, tr.y, p * 2300, 0, Math.PI * 2);
  else if (tr.type === 'up') ctx.rect(0, H - p * H, W, p * H);
  else if (tr.type === 'paper') { const k = p * (W + H) * 1.05; ctx.moveTo(W + 10, H + 10); ctx.lineTo(W + 10 - k, H + 10); ctx.lineTo(W + 10, H + 10 - k); ctx.closePath(); }
  ctx.clip();
}
function edgeFor(tr, p) {
  ctx.save();
  if (tr.type === 'iris') { ctx.strokeStyle = C.green2; ctx.lineWidth = 14; circ(tr.x, tr.y, p * 2300); ctx.stroke(); }
  else if (tr.type === 'up') { ctx.fillStyle = C.green; ctx.fillRect(0, H - p * H - 10, W, 14); ctx.fillStyle = C.mag; ctx.fillRect(0, H - p * H + 4, W, 6); }
  else if (tr.type === 'paper') { const k = p * (W + H) * 1.05; ctx.strokeStyle = '#B79668'; ctx.lineWidth = 16; line(W + 10 - k, H + 10, W + 10, H + 10 - k); }
  ctx.restore();
}

function render(t) {
  t = clamp(t, 0, DUR - 1e-6);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.setLineDash([]);
  let i = SCENES.findIndex(s => t >= s.t0 && t < s.t1); if (i < 0) i = SCENES.length - 1;
  const sc = SCENES[i];
  if (i > 0 && sc.tr && t < sc.t0 + TR) {
    const p = eio((t - sc.t0) / TR);
    SCENES[i - 1].f(t);
    ctx.save(); clipFor(sc.tr, p); sc.f(t); ctx.restore();
    edgeFor(sc.tr, p);
  } else sc.f(t);
  drawTexts(t);
}

/* ---------------------------------------------------------- 校验：阅读时长、字数、安全区 */
function audit() {
  for (let f = 0; f < DUR * FPS; f += 3) render(f / FPS);
  const rows = []; let chars = 0;
  TEXTS.forEach(T => {
    const n = T.lines.join('').replace(/[【】]/g, '').length; chars += n;
    const stable = (T.noOut ? T.t1 : T.t1 - FADE_OUT) - (T.instant ? T.t0 : T.t0 + FADE_IN);
    rows.push({ id: T.id, chars: n, stable: +stable.toFixed(2), cps: +(n / stable).toFixed(2), box: AUDIT.boxes[T.id] });
  });
  NOTES.forEach(N => { const stable = (N.noOut ? N.t1 : N.t1 - FADE_OUT) - (N.t0 + FADE_IN); rows.push({ id: N.id, chars: N.s.length, stable: +stable.toFixed(2), cps: +(N.s.length / stable).toFixed(2), box: AUDIT.boxes[N.id] }); });
  const safe = Object.entries(AUDIT.boxes).filter(([, b]) => b.x0 < 100 || b.x1 > 900 || b.y0 < 180 || b.y1 > 1500).map(([k, b]) => ({ k, b }));
  return { mainChars: chars, rows, outOfSafe: safe };
}

/* ---------------------------------------------------------- 播放控制 */
const qs = new URLSearchParams(location.search);
const RENDER_MODE = qs.has('render');
let cur = 0, playing = false, last = 0;
const $ = id => document.getElementById(id);
function setT(t) { cur = clamp(t, 0, DUR); render(cur); $('seek').value = cur; $('time').textContent = `${cur.toFixed(2).padStart(5, '0')} / 90.00`; }
function loop(now) {
  if (!playing) return;
  cur += (now - last) / 1000; last = now;
  if (cur >= DUR) { cur = DUR; playing = false; $('play').textContent = '播放'; }
  setT(cur); if (playing) requestAnimationFrame(loop);
}
function play() { if (cur >= DUR) cur = 0; playing = true; last = performance.now(); $('play').textContent = '暂停'; requestAnimationFrame(loop); }
function pause() { playing = false; $('play').textContent = '播放'; }
$('play').onclick = () => playing ? pause() : play();
$('restart').onclick = () => { setT(0); play(); };
$('seek').oninput = e => { pause(); setT(+e.target.value); };
$('rec').onclick = () => { document.body.classList.add('rec'); };
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
  if (e.key === 'Escape') document.body.classList.remove('rec');
  if (e.key === 'r' || e.key === 'R') document.body.classList.toggle('rec');
  if (e.key === 'Home') setT(0);
  if (e.key === 'ArrowRight') { pause(); setT(cur + 1 / FPS); }
  if (e.key === 'ArrowLeft') { pause(); setT(cur - 1 / FPS); }
});
window.SCV = { render, audit, DUR, FPS, frame: f => { render(f / FPS); return cv.toDataURL('image/png'); } };
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
  const t0 = parseFloat(qs.get('t') || '0');
  if (qs.has('record')) document.body.classList.add('rec');
  setT(isNaN(t0) ? 0 : t0);
  if (!RENDER_MODE && qs.has('autoplay')) play();
});
</script>
